name: Device end-to-end

# Runs the server and an agent with an Android emulator attached, then uses the device remotely the
# way the web client does (e2e/android_remote.py): the device shows up in the device center, a
# remote ticket opens the agent's control and screen connections, the screen is streamed, the
# device is kept for that user meanwhile and is free again afterwards. Runs for pushes that change
# the server, the agent or the test (on pull requests, paths are matched against the whole pull request).
on:
  workflow_dispatch:
  push:
    paths:
      - 'sonic-agent/**'
      - 'sonic-server/**'
      - 'e2e/**'
      - '.github/workflows/device-e2e.yml'

permissions:
  contents: read

concurrency:
  group: device-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e-root
          MYSQL_DATABASE: sonic
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pe2e-root"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      MYSQL_ROOT_PASSWORD: e2e-root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The agent's pom points at Aliyun mirrors; fetch from Google Maven (ddmlib) and Maven Central directly.
      - name: Resolve dependencies from the original repositories
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <settings>
            <mirrors>
              <mirror><id>google-direct</id><mirrorOf>google</mirrorOf><url>https://maven.google.com</url></mirror>
              <mirror><id>central-direct</id><mirrorOf>alimaven</mirrorOf><url>https://repo.maven.apache.org/maven2</url></mirror>
            </mirrors>
          </settings>
          SETTINGS
      - name: Build the server and the agent
        run: |
          mvn -B -f sonic-server/pom.xml -Dmaven.test.skip=true package
          mvn -B -f sonic-agent/pom.xml -Dmaven.test.skip=true -Dplatform=linux-x86_64 package
      # adb comes from the runner's Android SDK (ANDROID_HOME), which the emulator uses too.
      - name: Put the agent together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          agent=$RUNNER_TEMP/agent
          mkdir -p "$agent"
          cp sonic-agent/target/sonic-agent-linux-x86_64.jar "$agent/"
          cp -r sonic-agent/mini sonic-agent/plugins "$agent/"
          download() {
            gh release download "$2" -R "SonicCloudOrg/$1" -p '*_linux_x86_64.tar.gz' -O - | tar xz -C "$agent/plugins" "$3"
            [ "$3" = "$1" ] || mv "$agent/plugins/$3" "$agent/plugins/$1"
          }
          download sonic-android-supply v0.1.12 sas
          download sonic-ios-bridge v1.3.20 sib
          download sonic-go-mitmproxy v1.3.4 sonic-go-mitmproxy
          pip install websocket-client==1.8.0
      - name: Start the server
        run: bash e2e/start-server.sh "$RUNNER_TEMP/logs"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Use the device remotely
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          script: python3 e2e/android_remote.py "$RUNNER_TEMP/agent" "$RUNNER_TEMP/logs/agent.log"
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-e2e-logs
          path: ${{ runner.temp }}/logs
          retention-days: 3
