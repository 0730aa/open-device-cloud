name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test sonic-server
        run: mvn -B -f sonic-server/pom.xml install

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # The pom points at Aliyun mirrors; fetch from Google Maven (ddmlib) and Maven Central directly.
      - name: Resolve dependencies from the original repositories
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <settings>
            <mirrors>
              <mirror><id>google-direct</id><mirrorOf>google</mirrorOf><url>https://maven.google.com</url></mirror>
              <mirror><id>central-direct</id><mirrorOf>alimaven</mirrorOf><url>https://repo.maven.apache.org/maven2</url></mirror>
            </mirrors>
          </settings>
          SETTINGS
      - name: Build and test sonic-agent
        run: mvn -B -f sonic-agent/pom.xml test

  client-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sonic-client-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: sonic-client-web/package-lock.json
      # "prepare" runs husky install, which fails outside the repository root.
      - name: Install dependencies
        run: npm ci --ignore-scripts && npm rebuild esbuild
      - name: Build
        run: npm run build
