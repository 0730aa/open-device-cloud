server:
  port: 0

sonic:
  ticket:
    # EC P-256 key pair that signs remote tickets (base64 PKCS#8 / X.509). Optional with a single controller:
    # generated on first use and kept in the database. With several controllers, set the same pair on all.
    # 签发远控票据的EC P-256密钥对。单个controller时可不填（首次使用时生成并存入数据库）；多个controller时都要设置同一对
    private-key: ${TICKET_PRIVATE_KEY:}
    public-key: ${TICKET_PUBLIC_KEY:}

springdoc:
  paths-to-exclude: /exchange/send,/agents/hubControl

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  quartz:
    properties:
      org:
        quartz:
          scheduler:
            instanceName: SonicQuartz
            instanceId: AUTO
          jobStore:
            isClustered: true
    job-store-type: jdbc
    jdbc:
      initialize-schema: never

robot:
  client:
    host: http://${SONIC_SERVER_HOST:localhost}:${SONIC_SERVER_PORT:3000}
  img:
    success: "https://gitee.com/sonic-cloud/sonic-cloud/raw/main/src/assets/suc.png"
    warning: "https://gitee.com/sonic-cloud/sonic-cloud/raw/main/src/assets/warn.png"
    error: "https://gitee.com/sonic-cloud/sonic-cloud/raw/main/src/assets/fail.png"
