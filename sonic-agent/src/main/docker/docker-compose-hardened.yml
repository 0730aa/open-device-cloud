# Agent for machines owned by someone else than the people using the phones (e.g. a device
# marketplace). Compared to docker-compose.yml it drops privileged mode and host networking:
# only the agent's own port is published, so the ADB/SIB/WDA/proxy ports the agent opens stay
# inside the container, and a compromised agent does not own the host.
# 设备主人与使用者不是同一批人时（如开放设备平台）使用。与 docker-compose.yml 相比去掉了 privileged 和
# host 网络：只发布Agent自身端口，Agent打开的ADB/SIB/WDA/抓包端口留在容器内，Agent被攻破也拿不到宿主机。
version: '3'
services:
  sonic-agent:
    image: "sonicorg/sonic-agent-linux:SONIC_VERSION"
    environment:
      # Change to SONIC_SERVER_HOST and SONIC_SERVER_PORT of server | 改成server的SONIC_SERVER_HOST和SONIC_SERVER_PORT
      - SONIC_SERVER_HOST=192.168.1.1
      - SONIC_SERVER_PORT=3000
      # true if the server is served over https | server通过https提供服务时设为true
      - SONIC_SERVER_SSL=false
      # Address of this machine as seen by browsers | 浏览器访问本机的地址
      - AGENT_HOST=192.168.1.1
      - AGENT_PORT=7777
      # Optional, e.g. https://phone-1.example.com when behind a TLS proxy or tunnel | 可选，位于TLS代理或隧道之后时填写
      - AGENT_PUBLIC_URL=
      # Optional, e.g. https://relay.example.com: reach browsers through the platform's relay; then port 7777
      # below need not be published | 可选，如 https://relay.example.com：经平台中继服务浏览器，此时无需发布下面的7777端口
      - AGENT_RELAY_URL=
      # Replace with the key of agent generated by the new front-end | 替换为前端新增Agent生成的key
      - AGENT_KEY=29002272-4659-4808-a804-08ce3388b136
      # Keep both false unless you trust everyone who uses this agent | 除非完全信任所有使用者，否则保持false
      - AGENT_SCRIPT_ENABLE=false
      - AGENT_REMOTE_ACCESS_ENABLE=false
      - WDA_BUNDLE_ID=com.facebook.WebDriverAgentRunner.xctrunner
    ports:
      - "7777:7777"
    # USB passthrough without privileged mode; the cgroup rule also covers phones plugged in later
    # USB直通且无需privileged；cgroup规则也覆盖之后插入的手机
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      # iOS only | 仅iOS需要
      - /var/run/usbmuxd:/var/run/usbmuxd
    device_cgroup_rules:
      - 'c 189:* rmw'
    security_opt:
      - no-new-privileges:true
    restart: on-failure
